# Format and clippy (warnings denied) and the version, then every build of the extension, each tested with the
# ECMA-262 test data through the packaged build (php-build.yml).
name: ci
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: bindgen's libclang
        # ext-php-rs's bindgen loads the newest libclang it finds, and takes the system headers from the runner's clang.
        # A runner with several LLVMs (Ubuntu 26.04 has 20, 21 and 22) pairs a libclang with another version's
        # intrinsics headers, which it cannot parse. The libclang of the runner's clang is the one whose headers it reads.
        if: runner.os == 'Linux'
        run: |
          major=$(clang -dumpversion | cut -d. -f1)
          ls -d /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null || true
          test -d "/usr/lib/llvm-$major/lib"
          echo "clang $(clang -dumpversion): LIBCLANG_PATH=/usr/lib/llvm-$major/lib"
          echo "LIBCLANG_PATH=/usr/lib/llvm-$major/lib" >> "$GITHUB_ENV"
      - name: Format and clippy
        # The toolchain is named here rather than in a rust-toolchain.toml, which would override the nightly the
        # Windows builds need.
        run: |
          rustup toolchain install 1.98.0 --profile minimal -c clippy -c rustfmt
          cargo +1.98.0 fmt --check
          cargo +1.98.0 clippy -j 4 --locked --all-targets -- -D warnings
      - name: Check that docs/api.md is what src/lib.rs makes
        shell: pwsh
        run: ./tools/docs/gen-api.ps1 -Check

  builds:
    name: Builds
    # The probe tag runs the release's stamping (tools/release/stamp.ps1) in every build, as a release runs it.
    uses: ./.github/workflows/php-build.yml
    with:
      tag: 99.98.97

  gate:
    # The one check of this workflow that the ruleset of main requires: it passes when every job above passed (or was
    # skipped), so a job added here is required with no change to the ruleset.
    name: CI gate
    if: always()
    needs: [lint, builds]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
