name: php-build
# Builds and tests the corvus_regex_ecma262 PHP extension (the tests, and the ECMA-262 test data, pinned to a commit,
# through the packaged build; on linux x86_64 with PHP 8.5 NTS, also for Unicode 13 and 18 and for the grammar of
# ECMAScript 2020, as the data's overlays write it), and packages each build as the archive PIE downloads from a
# release (php_corvus_regex_ecma262-<version>_php<X.Y>-<arch>-<os>-<libc>[-zts].zip, or the Windows form), uploaded as an
# artifact named php-<archive name>. Called by ci.yml (every change) and php-publish.yml (a release) alike: every change builds
# and tests every archive the release does, so a release attaches exactly what was built and tested here.
#
# Every build is for one PHP minor version and thread-safety mode, on its own platform:
#   Linux glibc  setup-php's PHP; the extension is linked by zig against glibc 2.17's symbols (package.ps1 -Glibc), so
#                it loads on any distribution with glibc 2.17 or newer
#   Linux musl   the official php:<X.Y>-cli-alpine and php:<X.Y>-zts-alpine images (run with docker: JavaScript actions
#                do not run in Alpine containers on arm64)
#   macOS        setup-php's PHP (Homebrew), on Apple silicon
#   Windows      setup-php's PHP (windows.php.net); ext-php-rs needs a nightly Rust there, for PHP's vectorcall
on:
  workflow_call:
    inputs:
      tag:
        # A release's tag (php-publish.yml): its version is written into Cargo.toml and Cargo.lock, which hold 0.0.0,
        # before the build (tools/release/stamp.ps1), and so names the archives. CI passes 99.98.97, so that the
        # stamping runs in every build of every pull request, as a release runs it.
        type: string
        default: ''

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.98.0'
  # ext-php-rs needs nightly Rust on Windows (abi_vectorcall).
  RUST_NIGHTLY: 'nightly-2026-09-28'

jobs:
  matrix:
    name: Builds
    runs-on: ubuntu-latest
    outputs:
      unix: ${{ steps.matrix.outputs.unix }}
      alpine: ${{ steps.matrix.outputs.alpine }}
      windows: ${{ steps.matrix.outputs.windows }}
    steps:
      - name: Choose the builds
        id: matrix
        shell: python
        run: |
          import itertools, json, os
          php = ["8.2", "8.3", "8.4", "8.5"]
          ts = ["nts", "ts"]
          unix_platforms = [
              {"name": "linux x86_64", "os": "ubuntu-latest", "glibc": "2.17"},
              {"name": "linux arm64", "os": "ubuntu-24.04-arm", "glibc": "2.17"},
              # Apple silicon only: setup-php cannot install PHP 8.2 to 8.4 on the Intel runner (Homebrew has no
              # prebuilt PHP before 8.5 for Intel, and building it fails).
              {"name": "macos arm64", "os": "macos-latest", "glibc": ""},
          ]
          alpine_platforms = [
              {"name": "linux x86_64 musl", "os": "ubuntu-latest"},
              {"name": "linux arm64 musl", "os": "ubuntu-24.04-arm"},
          ]
          windows_platforms = [{"name": "windows x86_64", "os": "windows-latest"}]
          def grid(platforms):
              return [dict(p, php=v, ts=t) for p, v, t in itertools.product(platforms, php, ts)]
          unix, alpine, windows = grid(unix_platforms), grid(alpine_platforms), grid(windows_platforms)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key, value in (("unix", unix), ("alpine", alpine), ("windows", windows)):
                  out.write(f"{key}={json.dumps({'include': value})}\n")

  unix:
    name: corvus_regex_ecma262 (${{ matrix.name }}, PHP ${{ matrix.php }} ${{ matrix.ts }})
    needs: matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.unix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Write the release's version
        if: inputs.tag != ''
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: ./tools/release/stamp.ps1 -Tag $env:TAG
      - name: Checkout the ECMA-262 test data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: corvus-dotnet/ecma262-regex-test-data
          ref: 36e8b71c181fa10554760f461dc8c526fd3ffb42
          path: ecma262-regex-test-data
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup Zig
        if: matrix.glibc != ''
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: bindgen's libclang
        # ext-php-rs's bindgen loads the newest libclang it finds, and takes the system headers from the runner's clang.
        # A runner with several LLVMs (Ubuntu 26.04 has 20, 21 and 22) pairs a libclang with another version's
        # intrinsics headers, which it cannot parse. The libclang of the runner's clang is the one whose headers it reads.
        if: runner.os == 'Linux'
        run: |
          major=$(clang -dumpversion | cut -d. -f1)
          ls -d /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null || true
          test -d "/usr/lib/llvm-$major/lib"
          echo "clang $(clang -dumpversion): LIBCLANG_PATH=/usr/lib/llvm-$major/lib"
          echo "LIBCLANG_PATH=/usr/lib/llvm-$major/lib" >> "$GITHUB_ENV"
      - name: Build and package
        id: package
        shell: pwsh
        env:
          GLIBC: ${{ matrix.glibc }}
        run: |
          $archive = ./package.ps1 -Glibc $env:GLIBC -OutDir dist | Select-Object -Last 1
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "name=$([System.IO.Path]::GetFileNameWithoutExtension($archive))" >> $env:GITHUB_OUTPUT
      - name: Test the packaged extension
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          mkdir -p "$RUNNER_TEMP/ext" && unzip -o -q "$ARCHIVE" -d "$RUNNER_TEMP/ext"
          ext="$RUNNER_TEMP/ext/corvus_regex_ecma262.so"
          php -d "extension=$ext" -r 'echo PHP_VERSION, PHP_ZTS ? " ZTS" : " NTS", ": corvus-regex-ecma262 ", Corvus\RegexEcma262\crate_version(), "\n";'
          if [ "$RUNNER_OS" = Linux ]; then
            echo "Needs: $(objdump -T "$ext" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)"
          fi
          CORVUS_REGEX_PHP_EXTENSION="$ext" php -d "extension=$ext" tests/api.php
          CORVUS_REGEX_PHP_EXTENSION="$ext" php -d "extension=$ext" -d zend.assertions=1 -d assert.exception=1 tests/getting-started.php
          CORVUS_REGEX_PHP_EXTENSION="$ext" php -d memory_limit=-1 -d "extension=$ext" tools/dataset.php ecma262-regex-test-data/data wrong-cases.tsv
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.name == 'linux x86_64' && matrix.php == '8.5' && matrix.ts == 'nts'
        with:
          node-version: '24.22.1'
      - name: Run the ECMA-262 test data for other versions of Unicode and for ECMAScript 2020
        # The data as its own scripts write it for Unicode 13 and 18 (unicode.js apply) and for the grammar of
        # ECMAScript 2020 (edition.js apply), each judged through the packaged extension set to match.
        if: matrix.name == 'linux x86_64' && matrix.php == '8.5' && matrix.ts == 'nts'
        run: |
          ext="$RUNNER_TEMP/ext/corvus_regex_ecma262.so"
          data=ecma262-regex-test-data
          failed=()
          run() {
            name=$1; shift
            out="$RUNNER_TEMP/$name"
            case "$1" in
              unicode.js) node "$data/unicode.js" apply "$2" "$out" "$data/data" ;;
              edition.js) node "$data/edition.js" apply "$out" "$2" "$data/data" ;;
            esac
            shift 2
            CORVUS_REGEX_PHP_EXTENSION="$ext" php -d memory_limit=-1 -d "extension=$ext" tools/dataset.php "$out" \
              "wrong-cases-$name.tsv" "$@" || failed+=("$name")
          }
          run unicode-13 unicode.js 13.0 --unicode 13
          run unicode-18 unicode.js 18.0 --unicode 18
          # An empty version is the data's own Unicode.
          run es2020 edition.js "" --edition es2020
          run es2020-unicode-13 edition.js 13.0 --edition es2020 --unicode 13
          if [ ${#failed[@]} -gt 0 ]; then echo "::error::Wrong: ${failed[*]}"; exit 1; fi
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php-${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  alpine:
    name: corvus_regex_ecma262 (${{ matrix.name }}, PHP ${{ matrix.php }} ${{ matrix.ts }})
    needs: matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.alpine) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Write the release's version
        if: inputs.tag != ''
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: ./tools/release/stamp.ps1 -Tag $env:TAG
      - name: Checkout the ECMA-262 test data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: corvus-dotnet/ecma262-regex-test-data
          ref: 36e8b71c181fa10554760f461dc8c526fd3ffb42
          path: ecma262-regex-test-data
          persist-credentials: false
      - name: Build, test and package
        id: package
        env:
          IMAGE: php:${{ matrix.php }}-${{ matrix.ts == 'ts' && 'zts' || 'cli' }}-alpine
        # The archive is named as package.ps1 names it (PowerShell has no build for musl on arm64).
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD:/w" -w /w -e "UID=$(id -u)" -e "GID=$(id -g)" \
            -e RUST_TOOLCHAIN "$IMAGE" sh -euc '
              apk add --no-cache build-base clang-dev curl zip >/dev/null
              curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
              . "$HOME/.cargo/env"
              # The unwinder is linked statically (libgcc_eh.a, and libgcc.a for the atomic helpers it calls on
              # aarch64, in place of -lgcc_s), so the extension needs only musl: the stock Alpine PHP images do not
              # all ship libgcc (the arm64 ones do not).
              printf "%s\n" "#!/bin/sh" \
                "for a in \"\$@\"; do shift; if [ \"\$a\" = -lgcc_s ]; then set -- \"\$@\" -l:libgcc_eh.a -lgcc; else set -- \"\$@\" \"\$a\"; fi; done" \
                "exec cc \"\$@\"" > /tmp/cc-static-unwind.sh
              chmod +x /tmp/cc-static-unwind.sh
              RUSTFLAGS="-C target-feature=-crt-static -C linker=/tmp/cc-static-unwind.sh" cargo build --release --locked
              ext=target/release/libcorvus_regex_ecma262.so
              if readelf -d "$ext" | grep -q "NEEDED.*libgcc_s"; then echo "the extension needs libgcc_s" >&2; exit 1; fi
              php -d "extension=$PWD/$ext" -r "echo PHP_VERSION, PHP_ZTS ? \" ZTS\" : \" NTS\", PHP_EOL;"
              CORVUS_REGEX_PHP_EXTENSION="$PWD/$ext" php -d "extension=$PWD/$ext" tests/api.php
              CORVUS_REGEX_PHP_EXTENSION="$PWD/$ext" php -d "extension=$PWD/$ext" -d zend.assertions=1 -d assert.exception=1 tests/getting-started.php
              version=$(sed -n "s/^version = \"\(.*\)\"$/\1/p" Cargo.toml | head -n 1)
              arch=$(uname -m | sed "s/aarch64/arm64/")
              zts=$(php -r "echo PHP_ZTS ? \"-zts\" : \"\";")
              name="php_corvus_regex_ecma262-${version}_php$(php -r "echo PHP_MAJOR_VERSION, \".\", PHP_MINOR_VERSION;")-$arch-linux-musl$zts"
              mkdir -p /tmp/stage && cp "$ext" /tmp/stage/corvus_regex_ecma262.so
              (cd /tmp/stage && zip -q "/w/dist/$name.zip" corvus_regex_ecma262.so)
              chown -R "$UID:$GID" /w/dist target
              echo "$name" > /w/dist/name.txt
            '
          name=$(cat dist/name.txt)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "archive=dist/$name.zip" >> "$GITHUB_OUTPUT"
      - name: Test in the stock image
        # The packaged extension, loaded by a fresh container of the official image with nothing added (the build's
        # tools, libgcc among them, are not there).
        env:
          IMAGE: php:${{ matrix.php }}-${{ matrix.ts == 'ts' && 'zts' || 'cli' }}-alpine
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          mkdir -p ext && unzip -o -q "$ARCHIVE" -d ext
          docker run --rm -v "$PWD:/w" -w /w "$IMAGE" sh -euc '
            CORVUS_REGEX_PHP_EXTENSION=/w/ext/corvus_regex_ecma262.so php -d extension=/w/ext/corvus_regex_ecma262.so tests/api.php
            CORVUS_REGEX_PHP_EXTENSION=/w/ext/corvus_regex_ecma262.so php -d extension=/w/ext/corvus_regex_ecma262.so -d zend.assertions=1 -d assert.exception=1 tests/getting-started.php
            CORVUS_REGEX_PHP_EXTENSION=/w/ext/corvus_regex_ecma262.so php -d memory_limit=-1 \
              -d extension=/w/ext/corvus_regex_ecma262.so tools/dataset.php ecma262-regex-test-data/data wrong-cases.tsv
          '
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php-${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  windows:
    name: corvus_regex_ecma262 (${{ matrix.name }}, PHP ${{ matrix.php }} ${{ matrix.ts }})
    needs: matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.windows) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Write the release's version
        if: inputs.tag != ''
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: ./tools/release/stamp.ps1 -Tag $env:TAG
      - name: Checkout the ECMA-262 test data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: corvus-dotnet/ecma262-regex-test-data
          ref: 36e8b71c181fa10554760f461dc8c526fd3ffb42
          path: ecma262-regex-test-data
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
        env:
          phpts: ${{ matrix.ts }}
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal
          rustup default "$RUST_NIGHTLY"
          # bindgen's libclang: the runner's LLVM.
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - name: Build and package
        id: package
        shell: pwsh
        run: |
          $archive = ./package.ps1 -OutDir dist | Select-Object -Last 1
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "name=$([System.IO.Path]::GetFileNameWithoutExtension($archive))" >> $env:GITHUB_OUTPUT
      - name: Test the packaged extension
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "ext"
          Expand-Archive -Force $env:ARCHIVE $dir
          $ext = Join-Path $dir "$env:NAME.dll"
          php -d "extension=$ext" -r 'echo PHP_VERSION, PHP_ZTS ? " ZTS" : " NTS", ": corvus-regex-ecma262 ", Corvus\RegexEcma262\crate_version(), "\n";'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          php -d "extension=$ext" tests/api.php
          php -d "extension=$ext" -d zend.assertions=1 -d assert.exception=1 tests/getting-started.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CORVUS_REGEX_PHP_EXTENSION = $ext
          php -d memory_limit=-1 -d "extension=$ext" tools/dataset.php ecma262-regex-test-data/data wrong-cases.tsv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php-${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
